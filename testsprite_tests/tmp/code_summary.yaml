version: "2"
type: frontend
tech_stack:
  - Dart
  - Flutter 3.44
  - Riverpod
  - Go Router
  - Supabase
routes:
  - path: /
    file: lib/features/home/presentation/home_screen.dart
    auth_required: false
    description: Home feed with categories, featured and latest listings (Sello marketplace)
  - path: /home
    file: lib/features/home/presentation/home_screen.dart
    auth_required: false
    description: Home tab in bottom navigation
  - path: /search
    file: lib/features/listings/presentation/search_screen.dart
    auth_required: false
    description: Search listings and smart alerts entry
  - path: /listing/:id
    file: lib/features/listings/presentation/listing_detail_screen.dart
    auth_required: false
    description: Listing detail with gallery, price, seller info
  - path: /categories/:categoryId
    file: lib/features/listings/presentation/category_browse_screen.dart
    auth_required: false
    description: Browse listings in a category
  - path: /phone
    file: lib/features/auth/presentation/login_screen.dart
    auth_required: false
    description: Phone OTP login entry
  - path: /profile
    file: lib/features/profile/presentation/profile_screen.dart
    auth_required: true
    description: User profile and account menu
  - path: /settings
    file: lib/screens/settings/settings_screen.dart
    auth_required: true
    description: App settings
  - path: /language
    file: lib/screens/settings/language_screen.dart
    auth_required: false
    description: Language picker (Arabic, English, Kurdish, Turkish)
features:
  - name: Guest Home Browse
    description: Guest users browse the Sello home marketplace without signing in
    files:
      - lib/features/home/presentation/home_screen.dart
      - lib/features/home/widgets/listing_card.dart
      - lib/features/home/widgets/category_grid.dart
    entry_route: /
    user_interactions:
      - Land on home page and see listing cards
      - Scroll the home feed
      - Tap a category from the grid
      - Tap a listing card to open detail
    auth_required: false
  - name: Search Listings
    description: Search for listings by keyword
    files:
      - lib/features/listings/presentation/search_screen.dart
    entry_route: /search
    user_interactions:
      - Open search from bottom navigation
      - Type a search query
      - View search results or empty state
    auth_required: false
  - name: Listing Detail
    description: View listing photos, price, and seller section
    files:
      - lib/features/listings/presentation/listing_detail_screen.dart
    entry_route: /listing/:id
    user_interactions:
      - Open a listing from home
      - Scroll gallery and details
      - See seller other listings row
    auth_required: false
  - name: Category Browse
    description: Browse listings filtered by category
    files:
      - lib/features/listings/presentation/category_browse_screen.dart
    entry_route: /categories/:categoryId
    user_interactions:
      - Open category from home
      - Scroll category listing list
    auth_required: false
  - name: Language Settings
    description: Change app language without login
    files:
      - lib/screens/settings/language_screen.dart
    entry_route: /language
    user_interactions:
      - Navigate to language page
      - Select a language option
    auth_required: false
known_limitations:
  - issue: OneSignal push may log errors on Flutter web
    location: lib/features/chat/widgets/onesignal_handler.dart
    impact: Non-fatal; browse flows still work
  - issue: Auth-gated routes redirect guests to login
    location: lib/core/router/app_router.dart
    impact: Profile, settings, favorites, and post listing require login; home/search/listing detail are public
